<p-card [header]="title">
    <div class="recently__discussed-block poster-carousel">
        @if (loading) {
            <div class="movie-carousel__scroller movie-carousel__scroller--skeleton" role="status" aria-busy="true" aria-label="Loading movies">
                @for (i of skeletonSlots; track i) {
                    <div class="carousel-skeleton-item">
                        <div class="carousel-skeleton-item__poster-wrap">
                            <p-skeleton width="100%" height="100%" borderRadius="1rem" />
                        </div>
                        <p-skeleton width="85%" height="0.85rem" borderRadius="0.35rem" />
                        <p-skeleton width="40%" height="0.75rem" borderRadius="0.35rem" />
                    </div>
                }
            </div>
        } @else {
            <p-carousel
                class="movie-carousel__carousel"
                [value]="movies"
                [numVisible]="posterCarouselNumVisible"
                [numScroll]="posterCarouselNumScroll"
                [responsiveOptions]="posterCarouselResponsiveOptions"
                [circular]="false"
                [showIndicators]="false"
                [showNavigators]="true">
                <ng-template let-movie pTemplate="item">
                    <a class="carousel-item" [routerLink]="['/movie', movie.id]">
                        <div class="carousel-item__image">
                            <img [src]="movie.posterUrl" [alt]="movie.title" class="carousel-item__image-img" />
                        </div>
                        <div class="carousel-item__title">{{ movie.title }}</div>
                        <div class="carousel-item__year">{{ movie.year }}</div>
                    </a>
                </ng-template>
            </p-carousel>
        }
    </div>
</p-card>
