<nav class="navbar">
  <a routerLink="/" class="logo-link">
    <span class="logo-text">
      Review<span class="logo-highlight">Flix</span>
    </span>
  </a>

  <div class="navbar__search">
    <form [formGroup]="searchForm" class="navbar__search-form">
      <p-autocomplete
        formControlName="search"
        optionLabel="title"
        placeholder="Search"
        [fluid]="true"
        [suggestions]="moviesSuggestions"
        [panelStyle]="autocompletePanelStyle"
        panelStyleClass="navbar-search-ac-panel"
        (completeMethod)="loadSuggestions($event)"
        (onShow)="onAutocompletePanelShow()"
        (onSelect)="onMovieSelect($event)">

        <ng-template let-movie #item>
          <div class="navbar-ac-option">
            <img [src]="movie.posterUrl" class="navbar-ac-option__poster" alt="" />
            <span class="navbar-ac-option__text">
              @if (movie.mediaType === 'tv') {
                <span class="navbar-ac-option__tv">TV</span>
              }
              {{ movie.title }}, {{ movie.year }}
            </span>
          </div>
        </ng-template>
      </p-autocomplete>
    </form>
  </div>

  <div class="navbar__actions">
    <p-button
      icon="pi pi-user"
      label="Login"
      (onClick)="loginUser()">
    </p-button>
  </div>
</nav>

<p-toast />
