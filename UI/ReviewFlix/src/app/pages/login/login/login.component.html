<div class="login-container">
    <header class="login-header">
        <a routerLink="/" class="logo-link" aria-label="ReviewFlix — home">
            <span class="logo-text">
                <span class="logo-text__full">Review<span class="logo-highlight">Flix</span></span>
                <span class="logo-text__abbr" aria-hidden="true"><span class="logo-highlight">RF</span></span>
            </span>
        </a>
    </header>

    <div class="login-layout">
        <p-card class="login-card">
            <ng-template pTemplate="header">
                <form [formGroup]="AuthorizationTypeForm" class="login-type-form">
                    <p-selectbutton 
                        class="login-type-switch"
                        [options]="stateOptions" 
                        formControlName="AuthorizationType" 
                        optionLabel="label" 
                        optionValue="value" />
                </form>
            </ng-template>

            <ng-template pTemplate="body">
                @if (authType() === AuthorizationType.LOGIN) {
                    <form [formGroup]="loginForm" class="flex flex-column gap-2 w-full">
                        <div class="flex flex-column gap-2 w-full">
                            <label for="email">Email</label>
                            <input 
                                type="email" 
                                pInputText 
                                id="email" 
                                class="w-full"
                                formControlName="email"
                            />
                        </div>
                        <div class="flex flex-column gap-2 w-full">
                            <label for="password">Password</label>
                            <p-password 
                                formControlName="password" 
                                inputId="password"
                                [fluid]="true"
                                [feedback]="false"
                                [toggleMask]="true" />
                        </div>
                    </form>
                } @else {
                    <form [formGroup]="registerForm" class="flex flex-column gap-2 w-full">
                        <div class="flex flex-column gap-2 w-full">
                            <label for="name">Name</label>
                            <input 
                                type="text" 
                                pInputText 
                                id="name" 
                                class="w-full"
                                formControlName="name"
                            />
                        </div>
                        <div class="flex flex-column gap-2 w-full">
                            <label for="email">Email</label>
                            <input 
                                type="email" 
                                pInputText 
                                id="email" 
                                class="w-full"
                                formControlName="email"
                            />
                        </div>
                        <div class="flex flex-column gap-2 w-full">
                            <label for="password-register">Password</label>
                            <p-password
                                formControlName="password"
                                inputId="password-register"
                                [fluid]="true"
                                [toggleMask]="true" />
                        </div>
                    </form>
                }
            </ng-template>

            <ng-template pTemplate="footer">
                @if (authType() === AuthorizationType.LOGIN) {
                    <div class="login-actions">
                        <p-button class="login-submit" severity="primary" label="Login" [fluid]="true" (click)="login()" />
                    </div>
                } @else {
                    <div class="login-actions">
                        <p-button class="login-submit" severity="secondary" label="Register" [fluid]="true" (click)="register()" />
                    </div>
                }
            </ng-template>
        </p-card>
    </div>
</div>
