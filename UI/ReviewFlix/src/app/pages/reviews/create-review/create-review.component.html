<!-- create-review.component.html -->
<p-card class="create-review-card" header="Create a review">
    <form [formGroup]="reviewForm">
        <p-accordion [multiple]="true" [activeIndex]="[0, 1, 2, 3]">
            <!-- section 1: main information -->
            <p-accordion-panel value="0">
                <p-accordion-header>Main information</p-accordion-header>
                <p-accordion-content>
                    <div class="flex flex-column gap-4">
                        <div class="form-group">
                            <label>Overall rating (1-10) *</label>
                            <p-rating 
                                formControlName="rating"
                                [stars]="10"
                                [readonly]="false">
                            </p-rating>
                        </div>
                        
                        <div class="form-group flex flex-column gap-2">
                            <label>Review text *</label>
                            <textarea 
                                pInputTextarea 
                                formControlName="content"
                                rows="5"
                                placeholder="Describe your impression of the movie...">
                            </textarea>
                        </div>
                    </div>
                </p-accordion-content>
            </p-accordion-panel>
            
            <!-- section 2: pros and cons -->
            <p-accordion-panel value="1">
                <p-accordion-header>Pros and cons</p-accordion-header>
                <p-accordion-content>
                    <div class="form-section flex flex-column gap-4">
                        <div class="flex flex-column gap-2">
                            <label>What liked</label>
                            <textarea 
                                pInputTextarea 
                                formControlName="pros"
                                rows="3"
                                placeholder="For example: Excellent acting, great soundtrack, engaging plot...">
                            </textarea>
                        </div>
                        
                        <div class="flex flex-column gap-2">
                            <label>What didn't like</label>
                            <textarea 
                                pInputTextarea 
                                formControlName="cons"
                                rows="3"
                                placeholder="For example: Too long, slow pacing...">
                            </textarea>
                        </div>
                    </div>
                </p-accordion-content>
            </p-accordion-panel>
            
            <!-- section 3: detailed criteria -->
            <p-accordion-panel value="2">
                <p-accordion-header>Detailed criteria</p-accordion-header>
                <p-accordion-content>
                    <div class="criteria-list flex flex-column gap-3" formArrayName="criteria">
                        @for(criterion of criterionTemplates; track criterion.id; let i = $index) {
                            <div class="criterion-row flex flex-column align-items-start justify-content-start gap-2 w-full md:flex-row md:align-items-center md:justify-content-between" [formGroupName]="i">
                                <label class="criterion-label md:flex-1">{{ criterion.name }}</label>
                                <div class="flex align-items-center gap-2 md:gap-3">
                                    <p-rating 
                                        formControlName="score"
                                        [stars]="10"
                                        [readonly]="false">
                                    </p-rating>
                                </div>
                            </div>
                        }
                    </div>
                </p-accordion-content>
            </p-accordion-panel>
            
            <!-- section 4: tags -->
            <p-accordion-panel value="3">
                <p-accordion-header>Tags</p-accordion-header>
                <p-accordion-content>
                    <div class="flex flex-column gap-4 w-6">
                        <p-multiSelect 
                            formControlName="tagIds"
                            [options]="reviewTags"
                            optionLabel="name"
                            optionValue="id"
                            placeholder="Select tags"
                            appendTo="body">
                        </p-multiSelect>
                    </div>
                </p-accordion-content>
            </p-accordion-panel>
        </p-accordion>
        
        <div class="form-actions flex justify-content-between align-items-center w-full mt-4">
            <p-button
                label="Cancel"
                icon="pi pi-times"
                severity="danger"
                (onClick)="hideCreateReview()">
            </p-button>
            <p-button 
                label="Submit"
                icon="pi pi-check"
                severity="success"
                (onClick)="submitReview()"
                [disabled]="!reviewForm.valid">
            </p-button>
        </div>
    </form>
</p-card>
