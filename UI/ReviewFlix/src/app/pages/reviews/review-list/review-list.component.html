<p-card [header]="'Reviews'">
    <div class="reviews-wrapper">
        @if(reviews && reviews.length > 0) {
            <div class="flex flex-column gap-2">
                @for(review of reviews; track $index) {
                    <app-review [review]="review"></app-review>
                }
            </div>
        }
    
        @if(createNewReviewVisible) {
            <app-create-review [movieId]="movieId" (createNewReviewVisible)="onCreateReviewVisibility($event)"></app-create-review>
        }
        @else {
            <p-button 
                label="Create a review"
                icon="pi pi-plus"
                severity="danger"
                (onClick)="showCreateReview()">
            </p-button>
        }
    </div>
</p-card>
