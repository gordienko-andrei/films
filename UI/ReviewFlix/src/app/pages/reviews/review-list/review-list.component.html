<p-card [header]="'Reviews'">
    <div class="reviews-wrapper">
        @if(reviews && reviews.length > 0) {
            @for(review of reviews; track $index) {
                <div class="review-item">
                    <h3>{{ review.title }}</h3>
                    <p>{{ review.content }}</p>
                </div>
            }
        }
    
        @if(createNewReviewVisible) {
            <app-create-review [movieId]="movieId" (createNewReviewVisible)="createNewReviewVisible = $event"></app-create-review>
        }
        @else {
            <p-button 
                label="Create a review"
                icon="pi pi-plus"
                severity="danger"
                (onClick)="showCreateReview()">
            </p-button>
        }
    </div>
</p-card>
